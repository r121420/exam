<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英作文ドリル２｜空所補充トレーニング（100点満点）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Yomogi&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f1e6;
    --paper-line: rgba(163,32,44,0.16);
    --paper-line-strong: rgba(163,32,44,0.32);
    --ink:#1f2a3c;
    --ink-soft:#4a5568;
    --indigo:#223a5e;
    --indigo-deep:#152438;
    --red:#a3202c;
    --red-bright:#c62d2d;
    --green:#2f6b4f;
    --card:#fffdf8;
    --card-border:#e4dcc6;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
      repeating-linear-gradient(to right, transparent 0, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px);
    color: var(--ink);
    font-family: 'Inter', 'Shippori Mincho', sans-serif;
    min-height: 100vh;
    padding: 0 0 140px 0;
  }

  .margin-line{
    position: fixed;
    top:0; bottom:0;
    left: 56px;
    width: 2px;
    background: var(--paper-line-strong);
    z-index: 0;
  }

  header{
    position: relative;
    z-index: 1;
    padding: 46px 24px 30px 84px;
    max-width: 900px;
  }

  .eyebrow{
    font-family:'Shippori Mincho', serif;
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--red);
    margin: 0 0 10px 0;
    font-weight: 600;
  }

  h1{
    font-family:'Shippori Mincho', serif;
    font-weight: 800;
    font-size: clamp(30px, 5vw, 46px);
    margin: 0 0 8px 0;
    color: var(--indigo-deep);
    letter-spacing: 0.02em;
  }

  header p.sub{
    font-size: 14.5px;
    color: var(--ink-soft);
    margin: 0;
    line-height: 1.7;
    max-width: 560px;
  }

  main{
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 0 84px;
  }

  .section-title{
    display:flex;
    align-items: baseline;
    gap: 14px;
    margin: 44px 0 18px 0;
  }
  .section-title .num{
    font-family:'Shippori Mincho', serif;
    font-size: 34px;
    font-weight: 800;
    color: var(--red);
    line-height:1;
  }
  .section-title h2{
    font-family:'Shippori Mincho', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--indigo-deep);
    margin: 0;
  }
  .section-title .count{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-left: auto;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 3px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
    padding: 18px 22px 16px 22px;
    margin-bottom: 14px;
    position: relative;
  }
  .card::before{
    content: attr(data-qn);
    position: absolute;
    top: -11px;
    left: 18px;
    background: var(--indigo-deep);
    color: #f5f1e6;
    font-family:'Shippori Mincho', serif;
    font-weight: 600;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 2px;
    letter-spacing: 0.05em;
  }
  .card .pts{
    position:absolute;
    top: -11px;
    right: 18px;
    background: var(--red-bright);
    color: #fff;
    font-family:'Inter', sans-serif;
    font-weight: 700;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 2px;
    letter-spacing: 0.03em;
  }

  .jp{
    font-family:'Shippori Mincho', serif;
    font-size: 15.5px;
    color: var(--ink);
    margin: 8px 0 10px 0;
    line-height: 1.75;
  }

  .en{
    font-size: 15.5px;
    line-height: 2.3;
    color: var(--indigo-deep);
  }

  .blank{
    display: inline-flex;
    align-items: center;
    position: relative;
    margin: 0 2px;
  }

  input.gap{
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--indigo-deep);
    border: none;
    border-bottom: 2px solid var(--indigo);
    background: transparent;
    padding: 2px 4px;
    width: 118px;
    text-align: center;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  input.gap:focus{
    background: rgba(34,58,94,0.06);
  }
  input.gap.correct{
    border-color: var(--green);
    color: var(--green);
    background: rgba(47,107,79,0.07);
  }
  input.gap.wrong{
    border-color: var(--red-bright);
    color: var(--red-bright);
    background: rgba(198,45,45,0.07);
  }

  .mark{
    position:absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%) rotate(-8deg);
    font-family:'Yomogi', cursive;
    font-size: 22px;
    color: var(--red-bright);
    pointer-events:none;
    opacity: 0;
    transition: opacity .15s, transform .15s;
  }
  .mark.show{ opacity:1; }
  .mark.show.ok{ transform: translateX(-50%) rotate(-8deg) scale(1.15); }

  .correction{
    display:block;
    font-family:'Yomogi', cursive;
    font-size: 13.5px;
    color: var(--red-bright);
    margin-top: -2px;
    transform: rotate(-2deg);
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition: opacity .2s;
  }
  .correction.show{ opacity:1; max-height:40px; margin-top:6px; }

  .qscore{
    display:block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
    opacity: 0;
    transition: opacity .2s;
  }
  .qscore.show{ opacity: 1; }

  /* bottom control bar */
  .controls{
    position: fixed;
    bottom: 0; left:0; right:0;
    background: var(--indigo-deep);
    padding: 14px 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    z-index: 10;
    box-shadow: 0 -4px 18px rgba(0,0,0,0.18);
  }

  button{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    border-radius: 3px;
    padding: 11px 26px;
    cursor: pointer;
    border: none;
    letter-spacing: 0.02em;
  }
  #gradeBtn{
    background: var(--red-bright);
    color: #fff;
  }
  #gradeBtn:hover{ background: #b32626; }
  #resetBtn{
    background: transparent;
    color: #d8d4c6;
    border: 1px solid rgba(255,255,255,0.3);
  }
  #resetBtn:hover{ border-color: #fff; color:#fff; }

  .score-text{
    color: #f5f1e6;
    font-size: 13.5px;
    font-family:'Shippori Mincho', serif;
  }

  /* hanko stamp */
  .stamp{
    position: fixed;
    top: 40px;
    right: clamp(16px, 4vw, 60px);
    width: 96px;
    height: 96px;
    border: 4px solid var(--red-bright);
    border-radius: 6px;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    color: var(--red-bright);
    font-family:'Shippori Mincho', serif;
    background: rgba(255,255,255,0.55);
    opacity: 0;
    transform: scale(1.6) rotate(-18deg);
    transition: opacity .25s ease-out, transform .35s cubic-bezier(.2,1.4,.4,1);
    z-index: 5;
    pointer-events:none;
    text-align:center;
    line-height:1.15;
  }
  .stamp.show{
    opacity: 0.92;
    transform: scale(1) rotate(-8deg);
  }
  .stamp .kanji{ font-size: 12px; letter-spacing: 0.1em; font-weight:600; }
  .stamp .score{ font-size: 20px; font-weight: 800; margin-top:2px; }
  .stamp .max{ font-size: 10px; opacity:0.75; }

  @media (max-width: 640px){
    .margin-line{ left: 20px; }
    header{ padding: 34px 16px 24px 40px; }
    main{ padding: 0 16px 0 40px; }
    .stamp{ width: 78px; height: 78px; top: 18px; }
    .stamp .score{ font-size:16px; }
    input.gap{ width: 92px; }
  }

  @media (prefers-reduced-motion: reduce){
    .stamp, .mark, input.gap{ transition: none; }
  }
</style>
</head>
<body>

<div class="margin-line"></div>

<div class="stamp" id="stamp">
  <div class="kanji">採点</div>
  <div class="score" id="stampScore">--</div>
  <div class="max">/ 100点</div>
</div>

<header>
  <p class="eyebrow">FILL-IN-THE-BLANK WORKBOOK · SET 2</p>
  <h1>英作文ドリル２</h1>
  <p class="sub">日本文に合うように空所へ適語を入れましょう。全20問・各5点、100点満点です。1問につき空所が2つあり、それぞれ2.5点で採点されます。</p>
</header>

<main id="main"></main>

<div class="controls">
  <button id="gradeBtn">採点する</button>
  <button id="resetBtn">リセット</button>
  <span class="score-text" id="scoreText"></span>
</div>

<script>
// ---------- quiz data ----------
// each question = 2 blanks, each blank worth 2.5 points -> 20 questions x 5pt = 100pt total
const quizData = [
  { n:1,  jp:"彼は忙しいふりをした。",
    template:"He ___ ___ busy.",
    answers:[["pretended"],["to be"]] },
  { n:2,  jp:"私はうっかりして鍵を家に置き忘れた。",
    template:"I ___ my keys at home ___ mistake.",
    answers:[["left"],["by"]] },
  { n:3,  jp:"彼女はその知らせを聞いて驚きのあまり言葉を失った。",
    template:"She was so surprised at the news that she was ___ a ___ for words.",
    answers:[["at"],["loss"]] },
  { n:4,  jp:"彼はついに禁煙することに決めた。",
    template:"He finally made ___ his mind ___ quit smoking.",
    answers:[["up"],["to"]] },
  { n:5,  jp:"彼らはお互いに助け合うべきだ。",
    template:"They should ___ ___ another.",
    answers:[["help"],["one"]] },
  { n:6,  jp:"彼は他人の意見を気にしない。",
    template:"He doesn't ___ ___ other people's opinions.",
    answers:[["care"],["about"]] },
  { n:7,  jp:"私たちはお金の使い方に関して意見が合わない。",
    template:"We don't ___ ___ how to spend the money.",
    answers:[["agree"],["on"]] },
  { n:8,  jp:"彼女はダイエット中で甘いものを控えている。",
    template:"She is ___ ___ on sweets because she's on a diet.",
    answers:[["cutting"],["down"]] },
  { n:9,  jp:"彼はいつも時間を守る。",
    template:"He is always ___ ___.",
    answers:[["on"],["time"]] },
  { n:10, jp:"この本は子供にも大人にも人気がある。",
    template:"This book is popular ___ ___ children and adults.",
    answers:[["with"],["both"]] },
  { n:11, jp:"彼女はスペイン語を短期間で習得した。",
    template:"She ___ ___ Spanish in a short time.",
    answers:[["picked"],["up"]] },
  { n:12, jp:"彼は自分の失敗を素直に認めた。",
    template:"He ___ ___ to his mistake.",
    answers:[["owned"],["up"]] },
  { n:13, jp:"その計画は結局失敗に終わった。",
    template:"The plan ___ ___ failure in the end.",
    answers:[["ended"],["in"]] },
  { n:14, jp:"彼は何が起きても動揺しない。",
    template:"He never ___ his ___ no matter what happens.",
    answers:[["loses"],["temper"]] },
  { n:15, jp:"彼女はすぐに新しい環境に慣れた。",
    template:"She soon got ___ ___ the new environment.",
    answers:[["used"],["to"]] },
  { n:16, jp:"私は彼にひどい仕打ちをされて我慢の限界だった。",
    template:"I was fed ___ ___ the way he treated me.",
    answers:[["up"],["with"]] },
  { n:17, jp:"彼は上司に反対する勇気がなかった。",
    template:"He didn't have the ___ ___ disagree with his boss.",
    answers:[["courage"],["to"]] },
  { n:18, jp:"その事故のせいで交通が完全に止まった。",
    template:"The accident ___ traffic to a complete ___.",
    answers:[["brought"],["stop"]] },
  { n:19, jp:"彼女は突然泣き出した。",
    template:"She suddenly ___ ___ tears.",
    answers:[["burst"],["into"]] },
  { n:20, jp:"私たちはその問題について徹底的に話し合った。",
    template:"We discussed the problem ___ ___.",
    answers:[["in"],["detail"]] },
];

const POINTS_PER_QUESTION = 5;
const POINTS_PER_BLANK = POINTS_PER_QUESTION / 2; // 2.5

// ---------- render ----------
const main = document.getElementById('main');
let blankCounter = 0;

const st = document.createElement('div');
st.className = 'section-title';
st.innerHTML = `<span class="num">02</span>
  <h2>空所補充ドリル（全20問・100点満点）</h2>
  <span class="count">1問 5点</span>`;
main.appendChild(st);

quizData.forEach((q, qi) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-qn', 'Q' + q.n);
  card.dataset.qIndex = qi;

  const pts = document.createElement('span');
  pts.className = 'pts';
  pts.textContent = POINTS_PER_QUESTION + '点';
  card.appendChild(pts);

  const jpEl = document.createElement('p');
  jpEl.className = 'jp';
  jpEl.textContent = q.jp;
  card.appendChild(jpEl);

  const enEl = document.createElement('p');
  enEl.className = 'en';

  const parts = q.template.split('___');
  parts.forEach((part, i) => {
    enEl.appendChild(document.createTextNode(part));
    if (i < parts.length - 1) {
      const wrap = document.createElement('span');
      wrap.className = 'blank';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'gap';
      input.autocomplete = 'off';
      input.spellcheck = false;
      const id = 'b' + (blankCounter++);
      input.id = id;
      input.dataset.answers = JSON.stringify(q.answers[i]);
      input.dataset.qIndex = qi;

      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.id = id + '-mark';

      wrap.appendChild(input);
      wrap.appendChild(mark);
      enEl.appendChild(wrap);
    }
  });

  card.appendChild(enEl);

  const corr = document.createElement('span');
  corr.className = 'correction';
  corr.id = 'card-corr-' + qi;
  card.appendChild(corr);

  const qscore = document.createElement('span');
  qscore.className = 'qscore';
  qscore.id = 'card-score-' + qi;
  card.appendChild(qscore);

  main.appendChild(card);
});

// ---------- grading ----------
function normalize(str){
  return str
    .toLowerCase()
    .trim()
    .replace(/[’']/g, "'")
    .replace(/'/g, "")
    .replace(/[.,!?]/g, "")
    .replace(/\s+/g, " ");
}

document.getElementById('gradeBtn').addEventListener('click', () => {
  const inputs = document.querySelectorAll('input.gap');
  let totalScore = 0;

  // reset per-card correction text
  document.querySelectorAll('.correction').forEach(c => { c.textContent=''; c.classList.remove('show'); });

  const perCardCorrectBlanks = {};

  inputs.forEach(input => {
    const accepted = JSON.parse(input.dataset.answers).map(normalize);
    const value = normalize(input.value);
    const isCorrect = value.length > 0 && accepted.includes(value);
    const mark = document.getElementById(input.id + '-mark');
    const qi = input.dataset.qIndex;

    input.classList.remove('correct','wrong');
    mark.classList.remove('show','ok');

    if (isCorrect) {
      input.classList.add('correct');
      mark.textContent = '○';
      mark.classList.add('show','ok');
      totalScore += POINTS_PER_BLANK;
      perCardCorrectBlanks[qi] = (perCardCorrectBlanks[qi] || 0) + 1;
    } else {
      input.classList.add('wrong');
      mark.textContent = '✗';
      mark.classList.add('show');
      const card = input.closest('.card');
      const corr = card.querySelector('.correction');
      const answersForThis = JSON.parse(input.dataset.answers);
      appendHint(corr, answersForThis);
    }
  });

  // per-card score display
  quizData.forEach((q, qi) => {
    const correctBlanks = perCardCorrectBlanks[qi] || 0;
    const cardPts = correctBlanks * POINTS_PER_BLANK;
    const el = document.getElementById('card-score-' + qi);
    el.textContent = `この問題の得点: ${cardPts} / ${POINTS_PER_QUESTION}点`;
    el.classList.add('show');
  });

  document.getElementById('scoreText').textContent = `得点：${totalScore} / 100点`;

  const stamp = document.getElementById('stamp');
  document.getElementById('stampScore').textContent = totalScore;
  stamp.classList.remove('show');
  requestAnimationFrame(() => requestAnimationFrame(() => stamp.classList.add('show')));
});

function appendHint(corrEl, answers){
  const text = '正解: ' + answers.join(' / ');
  const existing = corrEl.textContent;
  if (!existing.includes(text)) {
    corrEl.textContent = existing ? existing + '　　' + text : text;
  }
  corrEl.classList.add('show');
}

document.getElementById('resetBtn').addEventListener('click', () => {
  document.querySelectorAll('input.gap').forEach(input => {
    input.value = '';
    input.classList.remove('correct','wrong');
  });
  document.querySelectorAll('.mark').forEach(m => m.classList.remove('show','ok'));
  document.querySelectorAll('.correction').forEach(c => {
    c.textContent = '';
    c.classList.remove('show');
  });
  document.querySelectorAll('.qscore').forEach(s => {
    s.textContent = '';
    s.classList.remove('show');
  });
  document.getElementById('scoreText').textContent = '';
  document.getElementById('stamp').classList.remove('show');
});
</script>
</body>
</html>
